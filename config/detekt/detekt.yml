complexity:
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    allowedFunctionsPerFile: 15

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
    # The defaults do not know the Android KMP test source sets, where backtick scenario names are
    # the project's convention.
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/androidDeviceTest/**'
      - '**/androidHostTest/**'
      - '**/androidUnitTest/**'
      - '**/commonTest/**'
      - '**/iosTest/**'
      - '**/jvmTest/**'
  TopLevelPropertyNaming:
    constantPattern: '[A-Za-z][_A-Za-z0-9]*'

style:
  # `docs/001-code-conventions.md` prefers guard clauses, and two of them already exceed the
  # default limit of two returns. Guard clauses are excluded; branchy code still counts.
  ReturnCount:
    excludeGuardClauses: true
  MagicNumber:
    ignoreAnnotated: ['Composable']
  MaxLineLength:
    active: false
