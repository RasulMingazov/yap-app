version: 1
language: ru

paths:
  specs: specs
  docs_index: docs/README.md

context:
  always:
    - CLAUDE.md
    - docs/README.md
  routes:
    mobile:
      match:
        - apps/mobile
        - mobile
        - compose
        - ios
        - android
      read:
        - docs/mobile/README.md
    server:
      match:
        - services/server
        - server
        - ktor
      read:
        - docs/server/README.md
    shared:
      match:
        - shared/contract
        - contract
        - dto
        - wire
      read:
        - docs/shared/README.md
    testing:
      match:
        - test
        - testing
        - stub
        - fixture
      read:
        - docs/testing/README.md

clarification:
  mode: blocking-only
  max_questions: 3

artifacts:
  by_operation:
    spec:
      - spec.md
    plan:
      - plan.md
      - tasks.md
  optional:
    - contracts
    - migrations
  never:
    - checklists
    - research.md
    - quickstart.md
    - memory
    - patches
    - evolution
    - continuation.md
    - verification.md

implementation:
  test_first: true
  update_existing_docs: true

git:
  auto_branch: false
  auto_commit: false

verification:
  report: chat
  commands:
    full: ./gradlew build
    static_analysis: ./gradlew detekt
    ios_when_kmp_boundary_changes: ./gradlew :apps:mobile:shared-app:compileKotlinIosSimulatorArm64
